<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MobaIdle v1</title><style>*{box-sizing:border-box}body{margin:0;background:#08121d;color:#e8f3ff;font:15px system-ui}header{padding:18px;background:#112438;border-bottom:1px solid #31506c}h1{margin:0;color:#8cf0d0}main{max-width:1100px;margin:auto;padding:16px}.panel{background:#12273a;border:1px solid #29485e;border-radius:16px;padding:15px;margin:12px 0}button,select{border:0;border-radius:9px;padding:11px;background:#31bda3;color:#051a23;font-weight:700;margin:3px}button:disabled{opacity:.4}.muted{color:#9cb8c9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.hero{background:#1a3549;border:2px solid transparent;border-radius:12px;padding:10px;cursor:pointer}.hero.selected{border-color:#54e0ba}.hero.banned{opacity:.25;pointer-events:none}.avatar{font-size:34px}.map{position:relative;aspect-ratio:1.8;background:radial-gradient(ellipse at center,#204d42,#102e34 65%,#0b2532);border:3px solid #527867;border-radius:16px;overflow:hidden}.lane{position:absolute;background:#9dbca545;transform-origin:center}.lane.a{height:10%;width:140%;left:-20%;top:45%;transform:rotate(-29deg)}.lane.b{height:10%;width:140%;left:-20%;top:45%;transform:rotate(29deg)}.lane.c{height:10%;width:100%;top:45%}.river{position:absolute;inset:0;background:linear-gradient(125deg,transparent 44%,#429ab252 45%,#429ab252 55%,transparent 56%)}.unit{position:absolute;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:14px;border:2px solid #fff9;transform:translate(-50%,-50%);transition:left .65s,top .65s}.blue{background:#2579e8}.red{background:#e34a5a}.tower{position:absolute;font-size:23px}.score{display:flex;justify-content:space-around;font-size:20px;font-weight:bold}.log{height:125px;overflow:auto;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}</style><header><h1>⚔️ MobaIdle <small style="font-size:13px;color:#a9d9d1">v1 · Playable Alpha</small></h1><div class="muted">MOBA Esports Manager · Club • Draft • Observer</div></header><main><section class="panel"><div class="tabs"><button onclick="tab('club')">🏟 Club</button><button onclick="tab('draft')">🎯 Draft</button><button onclick="tab('match')">📺 Observer</button></div></section><section id="club" class="panel"><h2>My Esports Club</h2><p id="clubstats"></p><button onclick="train()">Train team · 100 gold</button><button onclick="scout()">Scout · 150 gold</button><button onclick="startDraft()">Start ranked match</button><h3>Roster</h3><div id="roster" class="grid"></div></section><section id="draft" class="panel hidden"><h2>Ranked Draft</h2><p id="draftstatus"></p><div id="heroGrid" class="grid"></div><p><button id="draftAction" onclick="draftPick()">Confirm selection</button></p><div id="picks"></div></section><section id="match" class="panel hidden"><h2>Live Match Observer</h2><div class="score"><span id="blueScore">BLUE 0</span><span id="timer">00:00</span><span id="redScore">RED 0</span></div><div id="map" class="map"><div class="lane a"></div><div class="lane b"></div><div class="lane c"></div><div class="river"></div><div class="tower" style="left:8%;top:65%">🔷</div><div class="tower" style="right:8%;top:25%">🔶</div></div><p><button id="play" onclick="toggle()">▶ Play / Pause</button><button onclick="speed=speed===1?3:1;document.getElementById('spd').textContent=speed+'×'">Speed <span id="spd">1×</span></button><button onclick="startDraft()">New match</button></p><div id="result"></div><h3>Match Events</h3><div id="log" class="log"></div></section></main><script>const heroes=[['Astra','🪄','Mid'],['Rook','🛡️','Roam'],['Nyx','🗡️','Jungle'],['Vela','🏹','Gold'],['Brakk','🪓','EXP'],['Luna','🌙','Mid'],['Kairo','🐉','Jungle'],['Iris','🌿','Roam'],['Orion','⚡','Gold'],['Grom','🔥','EXP'],['Sora','❄️','Mid'],['Mira','🦊','Gold'],['Atlas','🪨','EXP'],['Riven','🐺','Jungle'],['Echo','💠','Roam']];let save=JSON.parse(localStorage.getItem('mobaidle_v1')||'null')||{gold:800,elo:1000,w:0,l:0,level:1};let bans=[],blue=[],red=[],chosen=-1,phase=0,units=[],tick=0,bs=0,rs=0,playing=false,speed=1,interval=null;const $=id=>document.getElementById(id);function persist(){localStorage.setItem('mobaidle_v1',JSON.stringify(save));renderClub()}function tab(id){['club','draft','match'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function renderClub(){$('clubstats').textContent='💰 '+save.gold+' gold · 🏆 '+save.elo+' ELO · '+save.w+'W / '+save.l+'L · Training Lv.'+save.level;$('roster').innerHTML=heroes.slice(0,5).map(h=>'<div class="hero"><div class="avatar">'+h[1]+'</div><b>'+h[0]+'</b><div class="muted">'+h[2]+'</div></div>').join('')}function train(){if(save.gold<100)return alert('Not enough gold');save.gold-=100;save.level++;persist()}function scout(){if(save.gold<150)return alert('Not enough gold');save.gold-=150;save.elo+=5;persist()}function startDraft(){playing=false;clearInterval(interval);bans=[];blue=[];red=[];phase=0;chosen=-1;tab('draft');renderDraft()}function renderDraft(){let isBan=phase<4;$('draftstatus').textContent=isBan?'Ban phase '+(phase+1)+'/4 · Choose a hero to ban':'Pick phase '+(blue.length+1)+'/5 · Choose your Blue team hero';$('heroGrid').innerHTML=heroes.map((h,i)=>'<div class="hero '+(bans.includes(i)?'banned ':'')+(chosen===i?'selected':'')+'" onclick="choose('+i+')"><div class="avatar">'+h[1]+'</div><b>'+h[0]+'</b><div class="muted">'+h[2]+'</div></div>').join('');$('picks').textContent='Bans: '+bans.map(i=>heroes[i][0]).join(', ')+' | Blue: '+blue.map(i=>heroes[i][0]).join(', ')+' | Red: '+red.map(i=>heroes[i][0]).join(', ')}function choose(i){if(bans.includes(i)||blue.includes(i)||red.includes(i))return;chosen=i;renderDraft()}function draftPick(){if(chosen<0)return alert('Select a hero');if(phase<4){bans.push(chosen);let options=heroes.map((_,i)=>i).filter(i=>!bans.includes(i));bans.push(options[Math.floor(Math.random()*options.length)]);phase+=2}else{blue.push(chosen);let options=heroes.map((_,i)=>i).filter(i=>!bans.includes(i)&&!blue.includes(i)&&!red.includes(i));red.push(options[Math.floor(Math.random()*options.length)]);phase++}chosen=-1;if(blue.length===5){beginMatch()}else renderDraft()}function beginMatch(){tab('match');tick=0;bs=0;rs=0;speed=1;units=[];$('log').innerHTML='';$('result').textContent='';for(let i=0;i<10;i++){let team=i<5?'blue':'red',idx=i<5?blue[i]:red[i-5],el=document.createElement('div');el.className='unit '+team;el.textContent=heroes[idx][1];el.title=heroes[idx][0]+' · '+heroes[idx][2];$('map').appendChild(el);units.push({el,team,i:i%5,idx})}playing=true;clearInterval(interval);interval=setInterval(step,650);step()}function event(s){$('log').innerHTML='<div>['+Math.floor(tick/60)+':'+String(tick%60).padStart(2,'0')+'] '+s+'</div>'+$('log').innerHTML}function step(){if(!playing)return;for(let k=0;k<speed;k++){tick+=3;for(let u of units){let p=Math.min(1,tick/240),offset=Math.sin(tick/13+u.i*2)*6,progress=u.team==='blue'?p:1-p;let lane=u.i%3;let y=lane===0?25+progress*50:lane===1?75-progress*50:50;u.el.style.left=(10+progress*80+offset*.35)+'%';u.el.style.top=(y+offset)+'%'}if(tick%30===0){let b=Math.random()<(.5+(save.level-1)*.015);if(b)bs++;else rs++;event((b?'🔵 Blue':'🔴 Red')+' secured a kill')}if(tick===90)event('🐢 Turtle has spawned');if(tick===180)event('🐉 Lord has spawned');if(tick>=240){playing=false;clearInterval(interval);let win=bs>=rs;save[win?'w':'l']++;save.elo+=win?25:-20;save.gold+=win?200:75;persist();$('result').textContent=win?'🏆 VICTORY · +25 ELO · +200 gold':'💔 DEFEAT · -20 ELO · +75 gold';event('Match finished');break}}$('blueScore').textContent='BLUE '+bs;$('redScore').textContent='RED '+rs;$('timer').textContent=String(Math.floor(tick/60)).padStart(2,'0')+':'+String(tick%60).padStart(2,'0')}function toggle(){playing=!playing;if(playing&&tick>=240)return;event(playing?'▶ Match resumed':'⏸ Match paused')}renderClub();</script></html>
